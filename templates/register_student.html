{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card mt-4 mb-5">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0">Student Registration</h4>
            </div>
            <div class="card-body p-4">
                
                <form method="POST" action="{{ url_for('register_student') }}">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Full Name <span class="text-danger">*</span></label>
                            <input type="text" name="name" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Roll Number <span class="text-danger">*</span></label>
                            <input type="text" name="roll_no" class="form-control" required>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Email Address <span class="text-danger">*</span></label>
                            <input type="email" name="email" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Phone Number <span class="text-danger">*</span></label>
                            <input type="text" name="phone_no" class="form-control" required>
                        </div>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-4">
                            <label class="form-label">Gender <span class="text-danger">*</span></label>
                            <select name="gender" class="form-select" required>
                                <option value="" disabled selected>Select...</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Date of Birth <span class="text-danger">*</span></label>
                            <input type="date" name="dob" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Location <span class="text-danger">*</span></label>
                            <input type="text" name="location" class="form-control" required>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label class="form-label">Department <span class="text-danger">*</span></label>
                            <select name="dept_id" class="form-select" required>
                                <option value="" disabled selected>Select Department...</option>
                                {% for dept in departments %}
                                    <option value="{{ dept.dept_id }}">{{ dept.dept_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Graduation Year <span class="text-danger">*</span></label>
                            <input type="number" name="graduation_year" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">CGPA <span class="text-danger">*</span></label>
                            <input type="number" step="0.01" name="cgpa" class="form-control" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label d-block">Do you have active backlogs? <span class="text-danger">*</span></label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="has_backlogs" id="backlogYes" value="yes" required>
                            <label class="form-check-label" for="backlogYes">Yes</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="has_backlogs" id="backlogNo" value="no" required>
                            <label class="form-check-label" for="backlogNo">No</label>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Create Password <span class="text-danger">*</span></label>
                        <input type="password" name="password" class="form-control" required>
                    </div>

                    <div class="text-center mb-3">
                        <a href="{{ url_for('login') }}" class="text-decoration-none">Already have an account? Login</a>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-success btn-lg">Register Account</button>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>
{% endblock %}
